MACOSX_SDK_VERSION:
- '11.0'
channel_sources:
- conda-forge
channel_targets:
- conda-forge main
cross_target_platform:
- linux-riscv64
docker_image:
- quay.io/condaforge/linux-anvil-aarch64:alma10
rust_arch:
- riscv64gc-unknown-linux-gnu
rust_arch_env:
- RISCV64GC_UNKNOWN_LINUX_GNU
rust_arch_env_build:
- AARCH64_UNKNOWN_LINUX_GNU
rust_default_cc:
- riscv64-conda-linux-gnu-cc
rust_default_cc_build:
- aarch64-conda-linux-gnu-cc
target_c_stdlib_version:
- '2.39'
target_platform:
- linux-aarch64
version:
- 1.98.1
zip_keys:
- - cross_target_platform
  - rust_arch
  - rust_arch_env
  - rust_default_cc
  - target_c_stdlib_version
  - channel_sources
  - channel_targets
  - version
