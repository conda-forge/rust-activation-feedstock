MACOSX_SDK_VERSION:
- '11.0'
channel_sources:
- conda-forge
channel_targets:
- conda-forge main
cross_target_platform:
- win-32
rust_arch:
- i686-pc-windows-msvc
rust_arch_env:
- I686_PC_WINDOWS_MSVC
rust_arch_env_build:
- AARCH64_PC_WINDOWS_MSVC
rust_default_cc:
- clang-cl
rust_default_cc_build:
- clang-cl
target_platform:
- win-arm64
version:
- 1.100.0
zip_keys:
- - cross_target_platform
  - rust_arch
  - rust_arch_env
  - rust_default_cc
  - channel_sources
  - channel_targets
  - version
